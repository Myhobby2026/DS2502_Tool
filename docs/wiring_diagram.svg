<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="900" viewBox="0 0 1240 900" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <style>
      .wire   { stroke:#1a1a1a; stroke-width:2.5; fill:none; }
      .wire12 { stroke:#c62828; stroke-width:3; fill:none; }
      .wiregnd{ stroke:#455a64; stroke-width:3; fill:none; }
      .comp   { fill:#ffffff; stroke:#1a1a1a; stroke-width:2; }
      .box    { fill:#eceff1; stroke:#37474f; stroke-width:2.5; rx:8; }
      .lbl    { fill:#111; font-size:15px; }
      .lblb   { fill:#111; font-size:15px; font-weight:bold; }
      .pin    { fill:#0d47a1; font-size:14px; font-weight:bold; }
      .net    { fill:#666; font-size:13px; font-style:italic; }
      .red    { fill:#c62828; }
      .dot    { fill:#1a1a1a; }
    </style>
  </defs>

  <text x="620" y="36" text-anchor="middle" font-size="24" font-weight="bold">DS2502 Programmer — Pin Connection Diagram (ESP32 / ESP8266 bridge)</text>
  <text x="620" y="60" text-anchor="middle" font-size="14" fill="#555">matches ds2502_bridge.ino defaults:  OW_PIN = GPIO4,  PROG_PIN = GPIO5,  PROG_ACTIVE_HIGH = 1</text>

  <!-- ================= ESP32 board ================= -->
  <rect x="60" y="150" width="220" height="490" class="box" rx="10"/>
  <text x="170" y="185" text-anchor="middle" class="lblb" font-size="17">ESP32 DevKit /</text>
  <text x="170" y="207" text-anchor="middle" class="lblb" font-size="17">ESP8266 NodeMCU</text>
  <text x="170" y="228" text-anchor="middle" class="lbl" fill="#c62828" font-size="14">(3.3 V logic!)</text>

  <!-- pins -->
  <line x1="255" y1="260" x2="280" y2="260" class="wire"/>
  <text x="248" y="265" text-anchor="end" class="pin">3V3</text>

  <line x1="255" y1="330" x2="280" y2="330" class="wire"/>
  <text x="248" y="325" text-anchor="end" class="pin">GPIO4</text>
  <text x="248" y="343" text-anchor="end" class="net">(NodeMCU D2)</text>
  <text x="150" y="365" text-anchor="middle" class="net">1-Wire DQ</text>

  <line x1="255" y1="470" x2="280" y2="470" class="wire"/>
  <text x="248" y="465" text-anchor="end" class="pin">GPIO5</text>
  <text x="248" y="483" text-anchor="end" class="net">(NodeMCU D1)</text>
  <text x="150" y="505" text-anchor="middle" class="net">PROG pulse ctrl</text>

  <line x1="255" y1="600" x2="280" y2="600" class="wiregnd"/>
  <text x="248" y="605" text-anchor="end" class="pin">GND</text>

  <!-- ================= 3V3 rail ================= -->
  <line x1="280" y1="260" x2="330" y2="260" class="wire"/>
  <line x1="330" y1="260" x2="330" y2="210" class="wire"/>
  <line x1="330" y1="210" x2="560" y2="210" class="wire"/>
  <text x="445" y="200" text-anchor="middle" class="lblb">3V3 rail</text>
  <circle cx="380" cy="210" r="4" class="dot"/>

  <!-- clamp diode D1 BAT54: anode at GPIO4 net, cathode to 3V3 -->
  <line x1="380" y1="330" x2="380" y2="292" class="wire"/>
  <polygon points="368,292 392,292 380,268" class="comp"/>
  <line x1="368" y1="268" x2="392" y2="268" class="wire" stroke-width="3.5"/>
  <line x1="380" y1="268" x2="380" y2="210" class="wire"/>
  <text x="400" y="278" class="lblb">D1  BAT54</text>
  <text x="400" y="296" class="lbl" font-size="13">Schottky clamp — protects</text>
  <text x="400" y="312" class="lbl" font-size="13">GPIO4 during the 12 V pulse</text>

  <!-- pullup R1 4.7k -->
  <line x1="560" y1="210" x2="560" y2="240" class="wire"/>
  <rect x="548" y="240" width="24" height="60" class="comp"/>
  <line x1="560" y1="300" x2="560" y2="330" class="wire"/>
  <text x="540" y="264" text-anchor="end" class="lblb">R1</text>
  <text x="540" y="282" text-anchor="end" class="lbl">4.7 kΩ</text>
  <text x="578" y="275" class="net">pull-up</text>

  <!-- ================= GPIO4 / DQ net ================= -->
  <line x1="280" y1="330" x2="415" y2="330" class="wire"/>
  <circle cx="380" cy="330" r="4" class="dot"/>
  <rect x="415" y="318" width="70" height="24" class="comp"/>
  <text x="450" y="360" text-anchor="middle" class="lblb">R2  470 Ω</text>
  <line x1="485" y1="330" x2="880" y2="330" class="wire"/>
  <circle cx="560" cy="330" r="4" class="dot"/>
  <circle cx="700" cy="330" r="4" class="dot"/>
  <text x="790" y="320" text-anchor="middle" class="lblb" fill="#0d47a1">1-Wire DQ bus</text>

  <!-- ================= +12V rail and pulse switch ================= -->
  <line x1="600" y1="120" x2="1130" y2="120" class="wire12"/>
  <text x="1135" y="125" class="lblb red" font-size="16">+12 V</text>
  <text x="865" y="106" text-anchor="middle" class="lbl red" font-size="13">programming supply 11.5 – 12 V (only during 480 µs pulse)</text>
  <circle cx="620" cy="120" r="4" fill="#c62828"/>
  <circle cx="700" cy="120" r="4" fill="#c62828"/>

  <!-- R4 10k gate pullup -->
  <line x1="620" y1="120" x2="620" y2="140" class="wire"/>
  <rect x="608" y="140" width="24" height="50" class="comp"/>
  <line x1="620" y1="190" x2="620" y2="215" class="wire"/>
  <text x="600" y="160" text-anchor="end" class="lblb">R4</text>
  <text x="600" y="178" text-anchor="end" class="lbl">10 kΩ</text>

  <!-- Q2 P-MOSFET -->
  <circle cx="700" cy="185" r="30" class="comp"/>
  <text x="700" y="180" text-anchor="middle" class="lblb" font-size="14">Q2</text>
  <text x="700" y="197" text-anchor="middle" class="lbl" font-size="11">P-MOSFET</text>
  <text x="740" y="165" class="lbl" font-size="13">AO3401 /</text>
  <text x="740" y="181" class="lbl" font-size="13">IRLML6402</text>
  <line x1="700" y1="120" x2="700" y2="155" class="wire12"/>
  <text x="708" y="147" class="net">S</text>
  <line x1="670" y1="185" x2="645" y2="185" class="wire"/>
  <line x1="645" y1="185" x2="645" y2="215" class="wire"/>
  <line x1="645" y1="215" x2="620" y2="215" class="wire"/>
  <text x="655" y="180" class="net">G</text>
  <circle cx="620" cy="215" r="4" class="dot"/>
  <line x1="700" y1="215" x2="700" y2="330" class="wire12"/>
  <text x="708" y="240" class="net">D</text>
  <text x="712" y="290" class="lbl red" font-size="13">12 V pulse onto DQ</text>

  <!-- Q1 NPN driver (collector hops over the DQ bus - no connection) -->
  <line x1="620" y1="215" x2="620" y2="321" class="wire"/>
  <path d="M 620 321 A 9 9 0 0 1 620 339" class="wire"/>
  <line x1="620" y1="339" x2="620" y2="444" class="wire"/>
  <circle cx="620" cy="470" r="30" class="comp"/>
  <text x="620" y="465" text-anchor="middle" class="lblb" font-size="14">Q1</text>
  <text x="620" y="482" text-anchor="middle" class="lbl" font-size="11">2N3904</text>
  <text x="628" y="440" class="net">C</text>
  <line x1="590" y1="470" x2="565" y2="470" class="wire"/>
  <text x="598" y="463" class="net">B</text>
  <line x1="620" y1="500" x2="620" y2="600" class="wire"/>
  <text x="628" y="525" class="net">E</text>

  <!-- R3 1k base resistor -->
  <line x1="280" y1="470" x2="495" y2="470" class="wire"/>
  <rect x="495" y="458" width="70" height="24" class="comp"/>
  <text x="530" y="450" text-anchor="middle" class="lblb">R3  1 kΩ</text>

  <!-- ================= DS2502 ================= -->
  <rect x="880" y="260" width="230" height="180" class="box" rx="10"/>
  <text x="995" y="292" text-anchor="middle" class="lblb" font-size="18">DS2502</text>
  <text x="995" y="312" text-anchor="middle" class="lbl" font-size="13">1 Kb Add-Only EPROM (TO-92)</text>

  <line x1="880" y1="330" x2="905" y2="330" class="wire"/>
  <text x="912" y="335" class="pin">2  DQ (DATA)</text>
  <line x1="880" y1="395" x2="905" y2="395" class="wiregnd"/>
  <text x="912" y="400" class="pin">1  GND</text>
  <text x="912" y="425" class="net">3  NC — not connected</text>

  <!-- TO-92 front view -->
  <path d="M 1040 335 A 28 28 0 0 1 1096 335 L 1096 355 L 1040 355 Z" class="comp"/>
  <line x1="1050" y1="355" x2="1050" y2="375" class="wire"/>
  <line x1="1068" y1="355" x2="1068" y2="375" class="wire"/>
  <line x1="1086" y1="355" x2="1086" y2="375" class="wire"/>
  <text x="1050" y="390" text-anchor="middle" class="lbl" font-size="11">1</text>
  <text x="1068" y="390" text-anchor="middle" class="lbl" font-size="11">2</text>
  <text x="1086" y="390" text-anchor="middle" class="lbl" font-size="11">3</text>
  <text x="1068" y="410" text-anchor="middle" class="net" font-size="11">flat face toward you</text>

  <!-- DS2502 GND route -->
  <line x1="880" y1="395" x2="845" y2="395" class="wiregnd"/>
  <line x1="845" y1="395" x2="845" y2="600" class="wiregnd"/>

  <!-- ================= GND rail ================= -->
  <line x1="280" y1="600" x2="1130" y2="600" class="wiregnd"/>
  <text x="1135" y="605" class="lblb" font-size="16" fill="#455a64">GND</text>
  <circle cx="620" cy="600" r="4" class="dot"/>
  <circle cx="845" cy="600" r="4" class="dot"/>
  <text x="960" y="590" text-anchor="middle" class="net">common ground — ESP32, DS2502 and the +12 V supply GND all tie here</text>

  <!-- ================= notes ================= -->
  <rect x="60" y="650" width="1120" height="230" fill="#fffde7" stroke="#f9a825" stroke-width="2" rx="8"/>
  <text x="80" y="680" class="lblb" font-size="16">How it works / notes</text>
  <text x="80" y="706" class="lbl">• READ / normal 1-Wire traffic:  GPIO4 ⇄ R2 (470 Ω) ⇄ DQ bus, idling high through R1 (4.7 kΩ to 3V3).  DS2502 is parasite-powered — only DQ and GND are wired.</text>
  <text x="80" y="732" class="lbl">• WRITE (program) pulse:  the bridge drives GPIO5 HIGH for ~500 µs  →  Q1 turns on  →  pulls Q2's gate low  →  Q2 switches +12 V onto the DQ bus (t</text>
  <text x="80" y="758" class="lbl">   PROG ≥ 480 µs per datasheet). R4 keeps Q2 firmly OFF at all other times, and the sketch parks GPIO5 LOW in setup(), so 12 V is never applied accidentally.</text>
  <text x="80" y="784" class="lbl">• Protection (mandatory on a 3.3 V MCU):  during the pulse, R2 limits the current and D1 clamps the GPIO4 node to ≈3.6 V. Never connect DQ directly to the ESP.</text>
  <text x="80" y="810" class="lbl">• Polarity:  this circuit is active-HIGH  →  keep  PROG_ACTIVE_HIGH = 1  in ds2502_bridge.ino. If your circuit inverts (pin LOW = 12 V on), set it to 0.</text>
  <text x="80" y="836" class="lbl red">• ⚠ Remove ALL other (non-EPROM) 1-Wire devices from the bus before programming — the 12 V pulse will destroy them.</text>
  <text x="80" y="862" class="lbl red">• ⚠ DS2502 is EPROM: bits only go 1 → 0, permanently. Double-check data before writing.</text>
</svg>
